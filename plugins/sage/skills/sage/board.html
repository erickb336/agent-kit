<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>sage board</title>
<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --surface-2: #f5f3ee; --text: #1d1d1b; --muted: #5f5e58; --line: #e3e0d8;
  --accent: #6b4fd8; --accent-soft: #efeafd; --ok: #1f7a4d; --ok-soft: #e4f3ea; --warn: #8f5400; --warn-soft: #fbefdc;
  --stop: #b3261e; --stop-soft: #fbe7e5; --code-bg: #f3f1ec; --ghost: #9b9890;
  --g-you: #6b4fd8; --g-build: #2f6fd1; --g-check: #0d7d77; --g-plan: #8a8577; --g-held: #b26b00; --g-closed: #3e8a5c;
  --strip: #2a2442; --strip-text: #f3efff; --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151514; --surface: #1d1d1b; --surface-2: #232320; --text: #ecebe6; --muted: #a7a59d; --line: #34332f;
    --accent: #a995ff; --accent-soft: #2a2442; --ok: #5cc28e; --ok-soft: #173326; --warn: #e3a447; --warn-soft: #3a2a12;
    --stop: #ff8a80; --stop-soft: #3d1c1a; --code-bg: #262522; --ghost: #6f6d66;
    --g-you: #a995ff; --g-build: #7fa8ff; --g-check: #4cc7bd; --g-plan: #a7a59d; --g-held: #e3a447; --g-closed: #5cc28e;
    --strip: #efeafd; --strip-text: #2a2442; --shadow: 0 1px 2px rgba(0,0,0,.4);
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; overflow-x: hidden; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Sample strip (sample data only) and header */
.strip { background: var(--strip); color: var(--strip-text); font-size: .78rem; font-weight: 600; letter-spacing: .02em; padding: 5px 16px; text-align: center; }
header.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px 0; }
.top-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 1.05rem; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); }
.brand .dot { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: inline-grid; place-items: center; color: var(--surface); font-size: .8rem; }
.built { color: var(--muted); font-size: .82rem; margin-left: auto; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 5px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
nav.scope { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; margin-top: 8px; }
nav.scope::-webkit-scrollbar { display: none; }
nav.scope a { text-decoration: none; color: var(--muted); padding: 8px 12px 9px; border-bottom: 2px solid transparent; white-space: nowrap; font-size: .9rem; font-weight: 500; }
nav.scope a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 650; }
nav.scope a .n { font-size: .74rem; color: var(--muted); margin-left: 4px; }

main { max-width: 1240px; margin: 0 auto; padding: 18px 16px 40px; }
main:focus { outline: none; }
h1 { font-size: 1.45rem; margin: 0; letter-spacing: -.01em; line-height: 1.25; }
h1:focus { outline: none; }
h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2 .count { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; font-size: .74rem; color: var(--text); letter-spacing: 0; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: .9rem; }
.crumbs { font-size: .85rem; color: var(--muted); margin-bottom: 6px; }
.crumbs a { color: var(--muted); }

/* Banners */
.banner { max-width: 1240px; margin: 12px auto 0; padding: 0 16px; }
.banner > div { border-radius: 10px; padding: 10px 14px; font-size: .9rem; border: 1px solid; }
.banner .fail { background: var(--stop-soft); border-color: var(--stop); }
.banner .stale { background: var(--warn-soft); border-color: var(--warn); }
.banner strong { display: block; }

/* Cards and lists */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.needs { display: grid; gap: 10px; }
.need { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border-left: 4px solid var(--g-you); }
.need .kind { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--g-you); white-space: nowrap; }
.need .what { font-weight: 650; min-width: 0; }
.need .what .pname { color: var(--muted); font-weight: 500; }
.need .ctx { grid-column: 2 / 3; color: var(--muted); font-size: .88rem; min-width: 0; }
.need .acts { grid-column: 3; grid-row: 1 / 3; display: flex; gap: 6px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 11px; font-size: .86rem; font-weight: 600; text-decoration: none; color: var(--text); cursor: pointer; white-space: nowrap; min-height: 34px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.empty { color: var(--muted); padding: 14px; font-size: .9rem; display: flex; gap: 10px; align-items: center; }
.empty .ico { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--ok-soft); color: var(--ok); flex: none; font-weight: 700; }

.ov { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 0 24px; }
.projects { display: grid; gap: 10px; }
.proj { display: block; padding: 12px 14px; text-decoration: none; color: var(--text); }
a.proj:hover { border-color: var(--accent); }
.proj-h { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.proj-h strong { font-size: 1rem; }
.proj-h .meta { color: var(--muted); font-size: .82rem; margin-left: auto; display: flex; gap: 6px; align-items: center; }
.bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); margin: 10px 0 8px; gap: 2px; }
.bar span { display: block; height: 100%; }
.counts { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
.counts div { font-size: .74rem; color: var(--muted); line-height: 1.25; }
.counts b { display: block; font-size: 1.05rem; color: var(--text); }
.counts div.zero b { color: var(--ghost); }
.sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: 1px; }
.running-n { font-size: .82rem; color: var(--muted); margin-top: 8px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

.chief { display: inline-flex; align-items: center; gap: 4px; font-size: .78rem; color: var(--muted); white-space: nowrap; }
.chief i { width: 16px; height: 16px; border-radius: 5px; display: inline-grid; place-items: center; font-style: normal; font-size: .66rem; font-weight: 800; color: #fff; }

.agents { display: grid; }
.agent { display: grid; grid-template-columns: 14px minmax(0,1fr) auto; gap: 2px 10px; padding: 10px 14px; border-top: 1px solid var(--line); text-decoration: none; color: var(--text); align-items: start; }
.agent:first-child { border-top: 0; }
.agent:hover { background: var(--surface-2); }
.agent .l1 { font-weight: 600; font-size: .92rem; min-width: 0; }
.agent .l2 { grid-column: 2 / 4; color: var(--muted); font-size: .82rem; min-width: 0; overflow-wrap: anywhere; }
.agent .time { color: var(--muted); font-size: .8rem; white-space: nowrap; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--g-build); margin-top: 6px; box-shadow: 0 0 0 0 var(--g-build); animation: pulse 1.8s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--g-build) 55%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none !important; } }
.quiet { color: var(--warn); font-weight: 600; }

/* Project view */
.gstrip { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.gstrip span { font-size: .8rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
.gstrip span.zero { color: var(--ghost); }
.tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.tcard { display: grid; gap: 6px; padding: 12px 14px; text-decoration: none; color: var(--text); border-left: 4px solid var(--gc, var(--line)); }
.tcard:hover { border-color: var(--accent); border-left-color: var(--gc); }
.tcard .t1 { display: flex; gap: 8px; align-items: baseline; }
.tcard .t1 .id { color: var(--muted); font-size: .8rem; }
.tcard .t1 strong { font-size: .98rem; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
.tag { font-size: .74rem; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.state { color: var(--gc, var(--text)); border-color: currentColor; background: transparent; font-weight: 650; }
.tag.risk { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
.tcard .who { font-size: .82rem; display: grid; gap: 3px; }
.tcard .who div { display: flex; gap: 6px; align-items: center; }
.tcard .who .pulse { margin-top: 0; width: 8px; height: 8px; }
.tcard .why { font-size: .84rem; color: var(--muted); }
details.closed-g > summary { cursor: pointer; list-style: none; }
details.closed-g > summary::-webkit-details-marker { display: none; }
details.closed-g > summary h2::before { content: "▸"; font-size: .8rem; }
details.closed-g[open] > summary h2::before { content: "▾"; }

/* Task view */
.thead { display: grid; gap: 8px; }
.thead .tags { margin-top: 2px; }
.route { display: flex; flex-wrap: wrap; gap: 6px 0; list-style: none; padding: 0; margin: 14px 0 0; counter-reset: s; }
.route li { display: flex; align-items: center; font-size: .82rem; }
.route li + li::before { content: ""; width: 18px; height: 2px; background: var(--line); margin: 0 4px; }
.route .st { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 5px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.route .st i { width: 18px; height: 18px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: .7rem; font-weight: 800; }
.route .done i { background: var(--ok-soft); color: var(--ok); }
.route .current { border-color: var(--g-build); font-weight: 650; }
.route .current i { background: var(--g-build); color: var(--surface); }
.route .you { border-color: var(--g-you); font-weight: 650; background: var(--accent-soft); }
.route .you i { background: var(--g-you); color: var(--surface); }
.route .held i { background: var(--warn-soft); color: var(--warn); }
.route .held { border-color: var(--warn); }
.route .redo i { background: var(--surface-2); color: var(--muted); }
.route .redo { border-style: dashed; }
.route .next { color: var(--muted); }
.route .next i { border: 1.5px solid var(--ghost); }
.route .notrun { color: var(--ghost); text-decoration: line-through; }
.route .st small { color: var(--muted); font-weight: 500; }
.callout { margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.callout.gate { border: 2px solid var(--g-you); }
.callout.held { border-left: 4px solid var(--warn); }
.callout.closed { border-left: 4px solid var(--g-closed); }
.callout h3 { margin: 0 0 4px; font-size: 1rem; }
.callout p { margin: 4px 0; }
.opts { display: grid; gap: 6px; margin: 10px 0 4px; }
.opt { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; flex-wrap: wrap; }
.opt.rec { border-color: var(--ok); background: var(--ok-soft); }
.opt .rec-l { color: var(--ok); font-weight: 700; font-size: .78rem; }
.hint { color: var(--muted); font-size: .82rem; }

.tlayout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 0 24px; align-items: start; }
.runs { display: grid; gap: 8px; position: relative; }
.run { padding: 12px 14px; display: grid; gap: 5px; scroll-margin-top: 120px; transition: box-shadow .2s, border-color .2s; }
.run.hl-maker { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.run.hl-user { border-color: var(--g-check); box-shadow: 0 0 0 2px color-mix(in srgb, var(--g-check) 25%, transparent); }
.run.flash { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.run.ghost { border-style: dashed; background: transparent; }
.run-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.run-h .rid { font-weight: 700; }
.run-h .role { font-weight: 650; }
.run-h .right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.stat { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; font-weight: 650; white-space: nowrap; }
.stat i { width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; font-size: .64rem; font-weight: 800; }
.s-running { color: var(--g-build); } .s-running i { background: var(--g-build); color: var(--surface); }
.s-done { color: var(--ok); } .s-done i { background: var(--ok-soft); color: var(--ok); }
.s-question { color: var(--g-you); } .s-question i { background: var(--accent-soft); color: var(--g-you); }
.s-blocked { color: var(--warn); } .s-blocked i { background: var(--warn-soft); color: var(--warn); }
.s-failed { color: var(--stop); } .s-failed i { background: var(--stop-soft); color: var(--stop); }
.s-stopped { color: var(--muted); } .s-stopped i { background: var(--surface-2); color: var(--muted); border-radius: 3px; }
.s-planned { color: var(--muted); } .s-planned i { border: 1.5px dashed var(--ghost); }
.run-meta { font-size: .82rem; color: var(--muted); display: flex; gap: 4px 10px; flex-wrap: wrap; align-items: center; }
.run-meta .sep { color: var(--line); }
.now { font-size: .85rem; background: color-mix(in srgb, var(--g-build) 9%, transparent); border-radius: 8px; padding: 5px 9px; overflow-wrap: anywhere; }
.io { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
.io-l { font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); width: 30px; padding-top: 5px; flex: none; }
.io .chips { display: flex; gap: 5px; flex-wrap: wrap; flex: 1; min-width: 0; }
.chip { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 3px 8px; font-size: .8rem; cursor: pointer; max-width: 100%; min-height: 28px; text-align: left; }
.chip:hover { border-color: var(--accent); }
.chip .k { font-size: .66rem; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.chip .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.c-report .k, .chip.c-brief .k { color: var(--accent); }
.chip.c-verdict.pass .v { color: var(--ok); font-weight: 650; }
.chip.c-verdict.findings .v { color: var(--warn); font-weight: 650; }
.chip.c-finding.high .k { color: var(--stop); } .chip.c-finding.medium .k { color: var(--warn); }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.note { font-size: .82rem; border-left: 3px solid var(--warn); padding: 3px 9px; background: var(--warn-soft); border-radius: 0 6px 6px 0; }
.note.fix { border-left-color: var(--accent); background: var(--accent-soft); }
.arena-h { font-size: .82rem; font-weight: 700; color: var(--muted); padding: 6px 2px 0; display: flex; gap: 8px; align-items: center; }
.arena { display: grid; gap: 8px; padding-left: 12px; border-left: 2px solid var(--accent-soft); }

.side { display: grid; gap: 0; }
.finding { padding: 10px 12px; border-top: 1px solid var(--line); display: grid; gap: 4px; font-size: .88rem; }
.finding:first-child { border-top: 0; }
.finding .fh { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sev { font-size: .7rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 999px; }
.sev.high { background: var(--stop-soft); color: var(--stop); }
.sev.medium { background: var(--warn-soft); color: var(--warn); }
.sev.low { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tri { font-size: .82rem; color: var(--muted); }
.tri b { color: var(--text); }
table.vt { border-collapse: collapse; width: 100%; font-size: .82rem; }
table.vt th, table.vt td { padding: 6px 8px; border-top: 1px solid var(--line); text-align: left; vertical-align: top; }
table.vt thead th { border-top: 0; color: var(--muted); font-weight: 600; font-size: .74rem; }
table.vt th.head-col { color: var(--text); }
.v-pass { color: var(--ok); font-weight: 700; } .v-findings { color: var(--warn); font-weight: 700; } .v-fail { color: var(--stop); font-weight: 700; }
.v-old { color: var(--ghost); }
.decisions { list-style: none; margin: 0; padding: 4px 0; }
.decisions li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 12px; font-size: .85rem; }
.decisions time { color: var(--muted); font-size: .78rem; padding-top: 1px; }
.decisions .who { font-weight: 650; }
.lineage { overflow-x: auto; padding: 10px; }
.lineage svg { display: block; }
.lineage .node rect:not(.bar-s) { fill: var(--surface); stroke: var(--line); stroke-width: 1.2; }
.lineage .node:hover rect, .lineage .node:focus rect { stroke: var(--accent); stroke-width: 2; }
.lineage .node:focus { outline: none; }
.lineage .node.ghostn rect { stroke-dasharray: 4 3; fill: transparent; }
.lineage text { fill: var(--text); font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.lineage text.small { fill: var(--muted); font-weight: 500; font-size: 10px; }
.lineage text.col { fill: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.lineage path.edge { fill: none; stroke: var(--ghost); stroke-width: 1.3; }
.lineage .bar-s { stroke-width: 0; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(20, 18, 30, .32); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--surface); border-left: 1px solid var(--line); z-index: 41; overflow-y: auto; box-shadow: -8px 0 32px rgba(0,0,0,.14); display: flex; flex-direction: column; }
.drawer[hidden], .scrim[hidden] { display: none; }
.d-h { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
.d-h .kind { font-size: .72rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); }
.d-h h2 { all: unset; display: block; font-size: 1.05rem; font-weight: 700; overflow-wrap: anywhere; }
.d-h .x { margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 36px; height: 36px; cursor: pointer; font-size: 1.1rem; flex: none; }
.d-b { padding: 4px 16px 24px; }
.d-b dl { margin: 0; display: grid; gap: 0; }
.d-b dt { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 14px; }
.d-b dd { margin: 4px 0 0; font-size: .9rem; overflow-wrap: anywhere; }
.d-b .runlink { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; text-decoration: none; color: var(--text); margin-top: 4px; }
.d-b .runlink:hover { border-color: var(--accent); }
.d-b pre { background: var(--code-bg); padding: 10px; border-radius: 8px; font-size: .78rem; white-space: pre-wrap; margin: 6px 0 0; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.fp { display: flex; gap: 6px; align-items: flex-start; }
.fp code { font-size: .74rem; word-break: break-all; }

/* Replacements for the design's style attributes: the CSP allows no style attribute */

/* Long values wrap instead of widening the page */
h1, .sub, .crumbs, .need .what, .need .ctx, .proj-h strong, .tcard .t1 strong, .tcard .why, .callout, .opt span, .finding, .decisions span, .agent .l1, .run-meta, .kid, .banner, .running-n, .note { overflow-wrap: anywhere; }

<body>
<a class="skip" href="#main">Skip to the board</a>
<div class="strip" id="strip" role="note" hidden>SAMPLE DATA: made-up projects, chief sessions, agents and files.</div>
<header class="top">
  <div class="top-in">
    <div class="top-row">
      <a class="brand" href="#/"><span class="dot" aria-hidden="true">s</span>sage board</a>
      <div class="built" id="built"></div>
    </div>
    <nav class="scope" id="scope" aria-label="Projects"></nav>
  </div>
</header>
<div class="banner" id="banner"></div>
<main id="main" tabindex="-1"><noscript><p>This board needs JavaScript to draw. In a shell, <code>sage board --text</code> prints the same board as text.</p></noscript></main>
<footer>Read-only. sage rebuilds this page at each write to a store. To act, tell a chief in the chat. <a href="#/text">The board in the chat</a></footer>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" hidden></aside>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="application/json" id="board-data">{{BOARD_DATA}}</script>
<script>
"use strict";
/* The sage board. sage writes the model into the board-data block at each rebuild (board.mjs); this code never changes
   between builds, and the page's CSP lets only this code run. Every value from the model goes through esc(). */
const D = JSON.parse(document.getElementById("board-data").textContent);
const dict = (o) => Object.assign(Object.create(null), o);
const time = (s) => (s ? new Date(s) : null);
const BUILT = time(D.built), CLOCK = new Date();
const CHIEFS = dict(D.chiefs), PROJECTS = D.projects, TASKS = D.tasks, RUNS = D.runs, LEDGER = D.ledger, FINDINGS = D.findings, GATES = D.gates, DECISIONS = D.decisions;
const P = dict(Object.fromEntries(PROJECTS.map((p) => [p.key, p])));
for (const r of RUNS) {
  r.startD = time(r.start); r.endD = time(r.end); r.lastD = time(r.last); r.atD = r.startD || time(r.at);
  r.reports.forEach((x, i) => { x.atD = time(x.at); x.n = i + 1; });
  r.steers.forEach((x, i) => { x.atD = time(x.at); x.n = i + 1; });
  r.children.forEach((c, i) => { c.n = i + 1; c.startD = time(c.start); c.endD = time(c.end); });
}

const GROUPS = [
  { key: "you", label: "Needs you" }, { key: "build", label: "Building" }, { key: "check", label: "Checking" },
  { key: "plan", label: "Planning" }, { key: "held", label: "Held" }, { key: "closed", label: "Closed" },
];
const BLOCK_ROLE = dict({ design: "designer", arena: "arena-judge", pe: "pe", build: "implementer", "code-review": "code-reviewer", "security-review": "security-reviewer", "ux-review": "ux-reviewer", qa: "qa", investigate: "pe", "evidence-review": "code-reviewer" });
const BLOCK_KIND = dict({ build: "checks-pass", "code-review": "review-clean", "security-review": "security-clean", "ux-review": "ux-clean", qa: "qa-pass", "evidence-review": "evidence-clean" });
const WRITERS = ["implementer", "designer"];
const PASS = /-(clean|pass)$/;
const EXT = ' target="_blank" rel="noopener noreferrer"';

const runsOfP = (p) => RUNS.filter((r) => r.p === p);
const findRun = (p, id) => RUNS.find((r) => r.p === p && r.id === id);
const tasksOf = (p) => TASKS.filter((t) => t.p === p);
const findTask = (p, id) => TASKS.find((t) => t.p === p && t.id === id);
const runsOf = (t) => RUNS.filter((r) => r.p === t.p && r.t === t.id);
const ledgerOf = (t) => LEDGER.filter((l) => l.p === t.p && l.task === t.id);
const lastDecision = (t) => DECISIONS.filter((x) => x.p === t.p && x.task === t.id).sort((a, b) => time(a.at) - time(b.at)).at(-1);
const openGates = (p) => GATES.filter((g) => !g.answer && (!p || g.p === p));
const running = (f) => RUNS.filter((r) => r.status === "running" && (!f || f(r)));
const needsChief = (f) => RUNS.filter((r) => r.needsChief && (!f || f(r)));

/* Route steps: for each block of the route, the first rule that matches (spec section 3.4). */
function stepsOf(t) {
  const runs = runsOf(t), head = t.head, led = ledgerOf(t);
  const writerRunning = runs.some((r) => WRITERS.includes(r.role) && r.status === "running");
  let held = t.state === "held";
  return t.route.map((b) => {
    const rr = runs.filter((r) => r.role === BLOCK_ROLE[b]);
    if (rr.some((r) => r.status === "running")) return { s: "current", note: rr.some((r) => r.k) ? rr.filter((r) => r.status === "running").length + " running" : "now" };
    const kind = BLOCK_KIND[b];
    if (kind) {
      const onHead = led.some((l) => l.kind === kind && (l.sha === head || (!l.sha && kind === "evidence-clean")));
      const older = led.some((l) => l.kind === kind && l.sha && l.sha !== head);
      if (onHead && !(writerRunning && b !== "build")) return { s: "done" };
      const anyByRole = led.some((l) => { const lr = findRun(t.p, l.run); return lr && lr.role === BLOCK_ROLE[b]; });
      if (onHead || older || (anyByRole && writerRunning)) return { s: "redo", note: "again" };
    } else if (rr.some((r) => r.status === "done")) return { s: "done" };
    if (rr.some((r) => r.status === "question") && t.state === "awaiting-you") return { s: "you" };
    if (t.state === "abandoned") return { s: "notrun" };
    if (held) { held = false; return { s: "held" }; }
    if (rr.some((r) => r.status === "waiting")) return { s: "next", note: "waiting" };
    return { s: "next" };
  });
}

/* ---------- Helpers ---------- */
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const pad = (n) => String(n).padStart(2, "0");
const hm = (d) => (d && !isNaN(d) ? pad(d.getHours()) + ":" + pad(d.getMinutes()) : "?");
const sameDay = (a, b) => a.toDateString() === b.toDateString();
const when = (d) => (d && !isNaN(d) ? (sameDay(d, CLOCK) ? hm(d) : d.getDate() + " " + MON[d.getMonth()] + " " + hm(d)) : "?");
function dur(ms) { const m = Math.max(0, Math.round(ms / 60000)); if (!(m >= 1)) return "under 1 min"; if (m < 60) return m + " min"; const h = Math.floor(m / 60); return h + " h" + (m % 60 ? " " + (m % 60) + " min" : ""); }
const ago = (d) => (d ? dur(CLOCK - d) : "?");
const kTok = (n) => (n >= 1000 ? Math.round(n / 1000) + "k" : String(n));
const tok = (r) => r.tokens == null ? (r.status === "running" ? "tokens at the end" : "tokens not known") : kTok(r.tokens) + " tokens" + (r.tools ? " · " + r.tools + " tool uses" : "");
const size = (b) => (b == null ? "size not known" : b >= 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB");
const taskHref = (t, extra) => "#/t/" + encodeURIComponent(t.p) + "/" + encodeURIComponent(t.id) + (extra ? "?" + extra : "");
const projHref = (p) => "#/p/" + encodeURIComponent(p);
const short = (s) => String(s).slice(0, 8);
const gh = (p, ...parts) => (P[p] && P[p].repo ? P[p].repo + "/" + parts.map((x) => encodeURIComponent(x)).join("/") : null);
const ROOT_SHOWN = D.home && D.root.startsWith(D.home + "/") ? "~" + D.root.slice(D.home.length) : D.root;
const storePath = (p) => ROOT_SHOWN + "/" + P[p].store;
const fileUrl = (p, rel) => "file://" + encodeURI(D.root + "/" + P[p].store + "/" + rel);
function hue(id) { let h = 2166136261; for (let i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) % 4; }
function chiefTag(id) {
  const c = id ? CHIEFS[id] : null;
  if (!c) return '<span class="chief"><i class="chx" aria-hidden="true">–</i>no chief recorded</span>';
  const name = c.name || short(id);
  const state = c.open ? "open" : "closed" + (c.closedAt ? " at " + hm(time(c.closedAt)) : "");
  return '<span class="chief" title="' + esc("Chief session " + short(id) + "…, " + state) + '"><i class="ch' + hue(id) + '" aria-hidden="true">' + esc(name[0].toUpperCase()) + "</i>" + esc(name) + (c.open ? "" : ' <span class="closed-l">closed</span>') + "</span>";
}
const roleL = (r) => r.role + (r.k ? " " + r.k + "/" + r.of : "");
const pid = (p, tid) => '<span class="pname">' + esc(p) + "</span> · " + esc(tid);
const STATUS_ICON = dict({ running: "●", done: "✓", question: "?", blocked: "!", failed: "×", stopped: "■", lost: "○", waiting: "", unknown: "–" });
const icon = (s) => (s in STATUS_ICON ? STATUS_ICON[s] : "–");
function statusHtml(r) {
  const s = r.status;
  let txt = s;
  if (s === "running") txt = "running " + ago(r.startD);
  else if (s === "failed" && r.noReport) txt = "failed: no report";
  else if (r.endD && r.startD) txt = s + " · " + dur(r.endD - r.startD);
  return '<span class="stat s-' + esc(s) + '"><i aria-hidden="true">' + esc(icon(s)) + "</i>" + esc(txt) + "</span>";
}
const FAILED = PROJECTS.filter((p) => p.failed);
const NOW_RUNNING = running().length;
const STALE = D.reload && CLOCK - BUILT >= 30 * 60000;

/* ---------- Artifacts: every chip and drawer comes from a copied file or a table row ---------- */
const KIND_LABEL = dict({ brief: "Brief", report: "Report", steer: "Steer message", transcript: "Transcript", branch: "Branch", commit: "Commit", pr: "Pull request", verdict: "Verdict", finding: "Finding" });
const KIND_INFO = dict({
  brief: "The brief that the chief sent to the agent. The hook copied it into the store at the spawn.",
  report: "The run's report: STATUS, RESULT, EVIDENCE, FINDINGS, QUESTIONS, NOT VERIFIED and BRANCH. The hook copied it at the hand-back.",
  steer: "A message that the chief sent to the run while it worked. The hook copied it into the store.",
  transcript: "The agent's full transcript. The hook copies it into the store when the agent stops, so it stays after Claude Code deletes its own copy.",
  branch: "The branch named on the report's BRANCH line.",
  commit: "The head SHA named on the report's BRANCH line. Verdicts refer to it.",
  pr: "The pull request named on the report's BRANCH line.",
  verdict: "A ledger row: one verdict on one commit. A verdict on an older commit does not count for the merge.",
  finding: "A findings row, with its triage and status.",
});
const ART = dict({}), USED = dict({});
function art(a) { ART[a.id] = a; return a.id; }
for (const r of RUNS) {
  const b = r.p + "/" + r.id;
  r.inputs = []; r.outputs = [];
  if (!r.legacy) r.inputs.push(art({ id: b + "/brief", kind: "brief", p: r.p, run: r, chief: r.chief, at: r.brief && time(r.brief.at), rel: "briefs/" + r.id + ".md", sha: r.brief && r.brief.sha256, lines: r.brief && r.brief.head, sent: !!r.brief }));
  for (const f of r.from) r.inputs.push(r.p + "/" + f.split("/").pop() + "/report1");
  for (const s of r.steers) r.inputs.push(art({ id: b + "/steer" + s.n, kind: "steer", p: r.p, run: r, chief: r.chief, at: s.atD, text: s.text, rel: "inputs/" + r.id + "." + s.n + ".md", sha: s.sha256, sent: true }));
  for (const x of r.reports) {
    r.outputs.push(art({ id: b + "/report" + x.n, kind: "report", p: r.p, by: r, rep: x, at: x.atD, rel: "reports/" + r.id + (x.n > 1 ? "." + x.n : "") + ".md", sha: x.sha256, lines: x.head, sent: true }));
    if (x.branch && WRITERS.includes(r.role)) r.outputs.push(art({ id: b + "/branch" + x.n, kind: "branch", p: r.p, by: r, label: x.branch, url: gh(r.p, "tree", ...x.branch.split("/")) }));
    if (x.sha) r.outputs.push(art({ id: b + "/commit" + x.n, kind: "commit", p: r.p, by: r, label: x.sha, url: gh(r.p, "commit", x.sha) }));
    if (x.pr && !RUNS.some((o) => o.p === r.p && o.t === r.t && o.reports.some((y) => y.pr === x.pr) && o.atD < r.atD)) r.outputs.push(art({ id: b + "/pr" + x.n, kind: "pr", p: r.p, by: r, label: "PR #" + x.pr, n: x.pr, url: gh(r.p, "pull", String(x.pr)) }));
  }
  for (const l of LEDGER.filter((l) => l.p === r.p && l.run === r.id && l.kind !== "checks-pass")) r.outputs.push(art({ id: b + "/v/" + l.kind + (l.sha || ""), kind: "verdict", p: r.p, by: r, v: l, label: l.kind + " · " + (l.sha || "no commit"), rel: "ledger.tsv" }));
  for (const f of FINDINGS.filter((f) => f.p === r.p && f.run === r.id)) r.outputs.push(art({ id: r.p + "/" + f.task + "/f/" + f.key, kind: "finding", p: r.p, by: r, f, label: f.key, rel: "findings.tsv" }));
  if (r.transcript) r.transcriptId = art({ id: b + "/transcript", kind: "transcript", p: r.p, by: r, rel: "transcripts/" + r.id + ".jsonl", bytes: r.transcript.bytes, src: r.transcript.src, sent: true });
}
for (const f of FINDINGS.filter((f) => !f.run)) art({ id: f.p + "/" + f.task + "/f/" + f.key, kind: "finding", p: f.p, by: null, f, label: f.key, rel: "findings.tsv" });
for (const r of RUNS) for (const a of r.inputs) if (ART[a]) (USED[a] = USED[a] || []).push(r);
function chip(id, ctx) {
  const a = ART[id]; if (!a) return "";
  let k = a.kind, v = a.label || a.kind, cls = "c-" + a.kind;
  if (a.kind === "report") v = a.by === ctx ? (a.rep.n > 1 ? "report " + a.rep.n : "report") : a.by.id + " report" + (a.by.t !== (ctx && ctx.t) ? " (" + a.by.t + ")" : "");
  if (a.kind === "brief") v = "brief";
  if (a.kind === "steer") v = "steer " + hm(a.at);
  if (a.kind === "verdict") cls += PASS.test(a.v.kind) ? " pass" : " findings";
  if (a.kind === "finding") { cls += " " + a.f.severity; k = a.f.severity; }
  if (a.kind === "transcript") v = size(a.bytes);
  if (a.kind === "pr") { k = "PR"; v = "#" + a.n; }

  const g = e.target.closest("[data-goto]"); if (g) goRun(g.dataset.goto);
});
function goRun(id) { const el = document.getElementById("run-" + id); if (el) { el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); el.setAttribute("tabindex", "-1"); el.focus({ preventScroll: true }); } }
document.getElementById("scrim").addEventListener("click", () => closeDrawer());
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeDrawer();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches("[data-goto]")) { e.preventDefault(); goRun(e.target.dataset.goto); }
  if (e.key === "Tab" && !document.getElementById("drawer").hidden) {
    const f = [...document.getElementById("drawer").querySelectorAll("a[href],button")]; if (!f.length) return;
    if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
  }
});
window.addEventListener("hashchange", () => render(false));
document.getElementById("strip").hidden = !D.sample;
render(true);
</script>
