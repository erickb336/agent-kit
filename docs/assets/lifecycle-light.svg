<text x="621.8" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#6B5242" text-anchor="middle"><tspan x="621.8" dy="0">next round, at most 3</tspan></text>
<rect x="36" y="372" width="1028" height="124.4" rx="8" fill="#FFFFFF" stroke="#E5600B" stroke-width="1.5"/>
<text x="64" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1A0E07" text-anchor="start"><tspan x="64" dy="0">Verified needs 1 clean cycle. Autopilot merges after 2 in a row.</tspan></text>
<text x="64" y="442.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#6B5242" text-anchor="start"><tspan x="64" dy="0">The state tool checks each move. A new commit voids the verdicts,</tspan><tspan x="64" dy="30.799999999999997">so the task is reviewed again.</tspan></text>
