<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 400" width="1100" height="400" role="img" aria-label="Following pstack: every week, pstack's principles come into upstream/pstack at a pinned commit. Your versions in principles/ win. The build runs the checks and tests and makes the sage plugin. If pstack changed a principle you override, the update waits for you; otherwise it merges.">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#BCAA98"/></marker>
<marker id="arrow-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FF7A1F"/></marker>
<marker id="arrow-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#F08A78"/></marker>
</defs>
<rect width="1100" height="400" fill="#100B08"/>
<rect x="40" y="70" width="210" height="80" rx="12" fill="#1A130F" stroke="#3A2B21" stroke-width="1.5"/><text x="145" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#F6EEE6" text-anchor="middle"><tspan x="145" dy="0">pstack</tspan></text><text x="145" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#BCAA98" text-anchor="middle"><tspan x="145" dy="0">by Lauren Tan (poteto)</tspan></text>
<path d="M254 110 L 330 110" fill="none" stroke="#BCAA98" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<text x="292" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#BCAA98" text-anchor="middle"><tspan x="292" dy="0">weekly</tspan></text>
<rect x="334" y="70" width="220" height="80" rx="12" fill="#1A130F" stroke="#3A2B21" stroke-width="1.5"/><text x="444" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#F6EEE6" text-anchor="middle"><tspan x="444" dy="0">upstream/pstack</tspan></text><text x="444" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#BCAA98" text-anchor="middle"><tspan x="444" dy="0">pinned commit + licence</tspan></text>
<rect x="334" y="196" width="220" height="80" rx="12" fill="#2A190D" stroke="#FF7A1F" stroke-width="2"/><text x="444" y="234" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#F6EEE6" text-anchor="middle"><tspan x="444" dy="0">principles/</tspan></text><text x="444" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#BCAA98" text-anchor="middle"><tspan x="444" dy="0">your versions win</tspan></text>
<path d="M558 110 C 610 110, 600 150, 646 150" fill="none" stroke="#BCAA98" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M558 236 C 610 236, 600 196, 646 196" fill="none" stroke="#BCAA98" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="650" y="128" width="160" height="90" rx="14" fill="#FF7A1F" stroke="#FF7A1F" stroke-width="3"/>
<text x="730" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="750" fill="#140D08" text-anchor="middle"><tspan x="730" dy="0">Build</tspan></text>
<text x="730" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#140D08" text-anchor="middle" opacity="0.85"><tspan x="730" dy="0">checks + tests</tspan></text>
<path d="M814 173 L 870 173" fill="none" stroke="#BCAA98" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="874" y="133" width="180" height="80" rx="12" fill="#1A130F" stroke="#3A2B21" stroke-width="1.5"/><text x="964" y="171" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#F6EEE6" text-anchor="middle"><tspan x="964" dy="0">sage plugin</tspan></text><text x="964" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#BCAA98" text-anchor="middle"><tspan x="964" dy="0">25 principles</tspan></text>
<path d="M730 222 L 730 296" fill="none" stroke="#FF7A1F" stroke-width="2" stroke-dasharray="5 6" stroke-linecap="round"/>
<rect x="560" y="300" width="340" height="70" rx="14" fill="#2A190D" stroke="#FF7A1F" stroke-width="1.5"/>
<text x="730" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="650" fill="#F6EEE6" text-anchor="middle"><tspan x="730" dy="0">pstack changed one of your versions?</tspan></text>
<text x="730" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#BCAA98" text-anchor="middle"><tspan x="730" dy="0">The update waits for you. Otherwise it merges.</tspan></text>
</svg>
