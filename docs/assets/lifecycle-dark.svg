<rect x="36" y="372" width="1028" height="166.39999999999998" rx="8" fill="#17100C" stroke="#FF6A0F" stroke-width="1.5"/>
<text x="64" y="412" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFF3E6" text-anchor="start"><tspan x="64" dy="0">Verified needs 1 clean cycle. Autopilot merges after the task's clean cycles:</tspan><tspan x="64" dy="33.599999999999994">1 for a tiny or small task, 2 for a large task or a task with a risk flag.</tspan></text>
<text x="64" y="479.2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#CDB6A0" text-anchor="start"><tspan x="64" dy="0">The state tool checks each move. A new commit voids the verdicts,</tspan><tspan x="64" dy="33.599999999999994">so the task is reviewed again.</tspan></text>
</g>
