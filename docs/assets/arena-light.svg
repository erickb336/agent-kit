<text x="744" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="750" fill="#1C1410" text-anchor="middle"><tspan x="744" dy="0">Arena judge</tspan></text>
<text x="720" y="214" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#6E5F53" text-anchor="middle"><tspan x="720" dy="0">scores, picks a base,</tspan><tspan x="720" dy="16.900000000000002">grafts the best parts</tspan></text>
<path d="M824 198 L 880 198" fill="none" stroke="#6E5F53" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="884" y="160" width="160" height="76" rx="12" fill="#FDEBD9" stroke="#E5600B" stroke-width="2"/><text x="964" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1C1410" text-anchor="middle"><tspan x="964" dy="0">Final version</tspan></text><text x="964" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6E5F53" text-anchor="middle"><tspan x="964" dy="0">one design</tspan></text>
<path d="M1048 198 L 1090 198" fill="none" stroke="#6E5F53" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<text x="1096" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#6E5F53" text-anchor="start"><tspan x="1096" dy="0">reviews</tspan><tspan x="1096" dy="18.2">and QA</tspan></text>
<text x="620" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#6E5F53" text-anchor="start"><tspan x="620" dy="0">All converge → keep the shared shape.</tspan><tspan x="620" dy="19.575">Wildly different → re-frame the brief once, then ask you.</tspan></text>
</svg>
