<text x="125" y="212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#FFF4E8" text-anchor="middle" opacity="0.85"><tspan x="125" dy="0">+ a rubric the</tspan><tspan x="125" dy="16.25">candidates don't see</tspan></text>
