<rect x="300" y="50" width="230" height="76" rx="12" fill="#FDEBD9" stroke="#E5600B" stroke-width="2"/><text x="415" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1C1410" text-anchor="middle"><tspan x="415" dy="0">Candidate 1</tspan></text><text x="415" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6E5F53" text-anchor="middle"><tspan x="415" dy="0">Opus · fewest taps</tspan></text>
