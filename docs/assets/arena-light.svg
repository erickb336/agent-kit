<path d="M534 200 C 580 200, 570 198, 616 198" fill="none" stroke="#6E5F53" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<path d="M212 198 C 260 198, 250 312, 296 312" fill="none" stroke="#6E5F53" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
<rect x="300" y="274" width="230" height="76" rx="12" fill="#FDEBD9" stroke="#E5600B" stroke-width="2"/><text x="415" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="650" fill="#1C1410" text-anchor="middle"><tspan x="415" dy="0">Candidate 3</tspan></text><text x="415" y="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6E5F53" text-anchor="middle"><tspan x="415" dy="0">Sonnet · reuse screens</tspan></text>
<path d="M534 312 C 580 312, 570 198, 616 198" fill="none" stroke="#6E5F53" stroke-width="2" marker-end="url(#arrow)" stroke-linecap="round"/>
