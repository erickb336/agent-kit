<path d="M40 98 L 510 98" fill="none" stroke="#3A2B21" stroke-width="1" stroke-linecap="round"/>
<rect x="168" y="116" width="318" height="70" rx="16" fill="#FF7A1F"/><text x="184" y="144" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="184" dy="0">sage mode. TrackMe: add CSV export,</tspan><tspan x="184" dy="24">and fix this week's crash.</tspan></text>
<rect x="64" y="200" width="300" height="94" rx="16" fill="#1E1611"/><text x="80" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F6EEE6" text-anchor="start"><tspan x="80" dy="0">T1 export: large · data</tspan><tspan x="80" dy="24">T2 crash: small · input</tspan><tspan x="80" dy="24">T2 starts now.</tspan></text>
<rect x="64" y="308" width="340" height="94" rx="16" fill="#1E1611"/><text x="80" y="336" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F6EEE6" text-anchor="start"><tspan x="80" dy="0">One question for T1: include deleted</tspan><tspan x="80" dy="24">trips in the export? Recommended: no.</tspan><tspan x="80" dy="24">Default if you don't answer: no.</tspan></text>
<rect x="428" y="420" width="58" height="46" rx="16" fill="#FF7A1F"/><text x="444" y="448" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#FFFFFF" text-anchor="start"><tspan x="444" dy="0">no</tspan></text>
<rect x="64" y="478" width="340" height="94" rx="16" fill="#1E1611"/><text x="80" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F6EEE6" text-anchor="start"><tspan x="80" dy="0">T2: build → code review → security</tspan><tspan x="80" dy="24">→ QA. Repair round 1: an empty date</tspan><tspan x="80" dy="24">still crashed. Fixed in 4787c81.</tspan></text>
<rect x="64" y="590" width="312" height="70" rx="16" fill="#1E1611"/><text x="80" y="618" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#F6EEE6" text-anchor="start"><tspan x="80" dy="0">T2 verified. QA ran the app: PASS.</tspan><tspan x="80" dy="24">→ PR #41 is ready for you.</tspan></text>
<text x="510" y="710" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#7F6F62" text-anchor="end"><tspan x="510" dy="0">Illustrative session, sample data</tspan></text>
<path d="M586 96 C 560 96, 540 151, 516 151" fill="none" stroke="#FF7A1F" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.7"/><circle cx="614" cy="90" r="16" fill="#FF7A1F"/><text x="614" y="95.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="614" dy="0">1</tspan></text><text x="642" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F6EEE6" text-anchor="start"><tspan x="642" dy="0">Switch it on</tspan></text><text x="642" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#BCAA98" text-anchor="start"><tspan x="642" dy="0">Say “sage mode” and what you want.</tspan><tspan x="642" dy="22.474999999999998">Any session: desktop, terminal, phone.</tspan></text>
<path d="M586 196 C 560 196, 540 247, 516 247" fill="none" stroke="#FF7A1F" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.7"/><circle cx="614" cy="190" r="16" fill="#FF7A1F"/><text x="614" y="195.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="614" dy="0">2</tspan></text><text x="642" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F6EEE6" text-anchor="start"><tspan x="642" dy="0">The chief frames each task</tspan></text><text x="642" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#BCAA98" text-anchor="start"><tspan x="642" dy="0">It sizes each task and picks a route.</tspan><tspan x="642" dy="22.474999999999998">A risk flag such as data or input adds</tspan><tspan x="642" dy="22.474999999999998">a security review.</tspan></text>
<path d="M586 318 C 560 318, 540 355, 516 355" fill="none" stroke="#FF7A1F" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.7"/><circle cx="614" cy="312" r="16" fill="#FF7A1F"/><text x="614" y="317.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="614" dy="0">3</tspan></text><text x="642" y="318" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F6EEE6" text-anchor="start"><tspan x="642" dy="0">One product question, at most</tspan></text><text x="642" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#BCAA98" text-anchor="start"><tspan x="642" dy="0">With a recommendation and a default.</tspan><tspan x="642" dy="22.474999999999998">Engineering choices are the chief's.</tspan></text>
<path d="M586 450 C 560 450, 540 525, 516 525" fill="none" stroke="#FF7A1F" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.7"/><circle cx="614" cy="444" r="16" fill="#FF7A1F"/><text x="614" y="449.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="614" dy="0">4</tspan></text><text x="642" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F6EEE6" text-anchor="start"><tspan x="642" dy="0">The team works; you don't watch code</tspan></text><text x="642" y="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#BCAA98" text-anchor="start"><tspan x="642" dy="0">Fresh agents build, review and test.</tspan><tspan x="642" dy="22.474999999999998">Findings go back for repair, bounded.</tspan></text>
<path d="M586 566 C 560 566, 540 625, 516 625" fill="none" stroke="#FF7A1F" stroke-width="1.5" stroke-dasharray="3 5" stroke-linecap="round" opacity="0.7"/><circle cx="614" cy="560" r="16" fill="#FF7A1F"/><text x="614" y="565.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="750" fill="#FFFFFF" text-anchor="middle"><tspan x="614" dy="0">5</tspan></text><text x="642" y="566" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#F6EEE6" text-anchor="start"><tspan x="642" dy="0">You get results, not code</tspan></text><text x="642" y="592" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#BCAA98" text-anchor="start"><tspan x="642" dy="0">Evidence, what was not checked, and</tspan><tspan x="642" dy="22.474999999999998">a pull request. You merge, or autopilot.</tspan></text>
</svg>
