<text x="86" y="423" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#1C1410" text-anchor="start"><tspan x="86" dy="0">A risk flag (auth, personal data, schema, money, secrets, outside input) adds the security review. The chief may add blocks, never remove these.</tspan></text>
