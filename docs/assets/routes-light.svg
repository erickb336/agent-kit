<text x="40" y="324" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="750" fill="#1C1410" text-anchor="start"><tspan x="40" dy="0">investigate</tspan></text>
